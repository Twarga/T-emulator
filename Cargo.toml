[package]
name = "t-emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.9"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
gilrs = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6"
rodio = "0.17"
chrono = "0.4"

[build-dependencies]
slint-build = "1.9"
