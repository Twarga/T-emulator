[package]
name = "t-emulator"
version = "0.1.0"
edition = "2021"
default-run = "t-emulator"

[[bin]]
name = "t-emulator"
path = "src/main.rs"

[[bin]]
name = "shot"
path = "src/bin/shot.rs"

[dependencies]
slint = { version = "1.9", features = ["renderer-software"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
gilrs = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rodio = "0.17"
chrono = "0.4"

[build-dependencies]
slint-build = "1.9"
