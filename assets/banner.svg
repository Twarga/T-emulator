<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#101024"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4ea8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4ea8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6bff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8a6bff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8a6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3ddc84" stop-opacity=".4"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9db8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)" rx="14"/>

  <!-- wave ribbons -->
  <path d="M0,220 C150,170 300,270 450,220 S750,170 900,220 S1150,270 1200,220"
        fill="none" stroke="url(#w1)" stroke-width="3"/>
  <path d="M0,245 C180,200 340,290 520,245 S800,200 980,245 S1160,290 1200,245"
        fill="none" stroke="url(#w2)" stroke-width="2.5"/>
  <path d="M0,270 C200,235 360,305 560,270 S860,235 1040,270 S1180,300 1200,270"
        fill="none" stroke="url(#w3)" stroke-width="2"/>

  <!-- ghost console dots -->
  <circle cx="90"  cy="80" r="3" fill="#4ea8ff" opacity=".5"/>
  <circle cx="1110" cy="60" r="3" fill="#8a6bff" opacity=".5"/>
  <circle cx="1150" cy="290" r="3" fill="#3ddc84" opacity=".5"/>
  <circle cx="60" cy="290" r="3" fill="#4ea8ff" opacity=".3"/>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="72" font-weight="700" fill="url(#title)" letter-spacing="2">T-EMULATOR</text>
  <text x="600" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="24" font-weight="400" fill="#8a8ab0" letter-spacing="4">EVERY CONSOLE. ITS REAL MENU.</text>
</svg>
